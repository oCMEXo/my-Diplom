<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collab: work on a project together</title>
    <meta name="theme-color" content="#1e1f22" />
    <meta name="description" content="One shared place for code, documents and boards, in real time" />
    <!-- For link previews. Invitation links get their own title from the API (see /preview in apps/api). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Collab" />
    <meta property="og:title" content="Collab: work on a project together" />
    <meta property="og:description" content="One shared place for code, documents and boards, in real time" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      (function () {
        try {
          var stored = localStorage.getItem("collab.theme");
          var light = stored ? stored === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
